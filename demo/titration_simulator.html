<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酸鹼滴定模擬</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent2: #38bdf8;
      --danger: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0b1120 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 16px;
      letter-spacing: .02em;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 16px;
    }
    .panel {
      background: rgba(17, 24, 39, .88);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    .section-title {
      font-size: 1rem;
      margin: 0 0 12px;
      color: #cbd5e1;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: grid;
      gap: 5px;
    }
    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
      color: var(--text);
      padding: 8px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      color: #052e16;
      background: var(--accent);
      font-weight: 700;
    }
    button.secondary {
      color: #082f49;
      background: var(--accent2);
    }
    .apparatus {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      align-items: end;
      min-height: 330px;
    }
    .burette {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      height: 320px;
      position: relative;
      background: #0b1220;
    }
    .tube {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      top: 28px;
      bottom: 42px;
      border: 2px solid #64748b;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
    }
    .liquid {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      transition: height .2s;
    }
    .tap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 17px;
      width: 70px;
      height: 10px;
      background: #475569;
      border-radius: 7px;
    }
    .beaker {
      border: 2px solid #64748b;
      border-top: 0;
      border-radius: 0 0 16px 16px;
      height: 170px;
      position: relative;
      overflow: hidden;
      background: #020617;
    }
    .beaker-liquid {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      background: linear-gradient(180deg, rgba(244,114,182,.9) 0%, rgba(219,39,119,.9) 100%);
      transition: background .2s;
    }
    .beaker-text {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 10px;
      font-size: 0.84rem;
      color: #cbd5e1;
      line-height: 1.4;
    }
    #curve {
      width: 100%;
      height: 380px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #020617;
    }
    .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: .83rem;
    }
    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>酸鹼滴定模擬實驗（左：滴定裝置，右：滴定曲線）</h1>
    <div class="grid">
      <section class="panel">
        <h2 class="section-title">滴定裝置與參數</h2>
        <div class="controls">
          <label>待測溶液（錐形瓶）
            <select id="analyteType">
              <option value="SA">強酸（如 HCl）</option>
              <option value="WA">弱酸（如 CH₃COOH）</option>
              <option value="SB">強鹼（如 NaOH）</option>
              <option value="WB">弱鹼（如 NH₃）</option>
            </select>
          </label>
          <label>滴定劑（滴定管）
            <select id="titrantType">
              <option value="SB">強鹼（如 NaOH）</option>
              <option value="SA">強酸（如 HCl）</option>
            </select>
          </label>
          <label>待測濃度 (M)
            <input id="ca" type="number" value="0.1" min="0.001" max="2" step="0.001" />
          </label>
          <label>滴定劑濃度 (M)
            <input id="cb" type="number" value="0.1" min="0.001" max="2" step="0.001" />
          </label>
          <label>待測體積 (mL)
            <input id="va" type="number" value="25" min="1" max="200" step="1" />
          </label>
          <label>弱酸 pKa / 弱鹼 pKb
            <input id="pKa" type="number" value="4.76" min="0" max="14" step="0.01" />
          </label>
        </div>
        <div class="buttons">
          <button id="drop1">滴加 1 mL</button>
          <button id="drop5" class="secondary">滴加 5 mL</button>
          <button id="reset" class="secondary">重設</button>
        </div>

        <div class="apparatus">
          <div class="burette">
            <div class="tube"><div id="buretteLiquid" class="liquid" style="height: 88%"></div></div>
            <div class="tap"></div>
          </div>
          <div class="beaker">
            <div id="beakerLiquid" class="beaker-liquid"></div>
            <div id="status" class="beaker-text"></div>
          </div>
        </div>
        <div class="note">提示：若化學組合不合法（如強酸滴定強酸），程式會提醒並自動改成最常見配對。</div>
      </section>

      <section class="panel">
        <h2 class="section-title">滴定曲線</h2>
        <canvas id="curve" width="720" height="380"></canvas>
        <div class="note" id="eqNote"></div>
      </section>
    </div>
  </div>

  <script>
    const analyteType = document.getElementById('analyteType');
    const titrantType = document.getElementById('titrantType');
    const ca = document.getElementById('ca');
    const cb = document.getElementById('cb');
    const va = document.getElementById('va');
    const pKaInput = document.getElementById('pKa');
    const status = document.getElementById('status');
    const eqNote = document.getElementById('eqNote');
    const beakerLiquid = document.getElementById('beakerLiquid');
    const buretteLiquid = document.getElementById('buretteLiquid');
    const canvas = document.getElementById('curve');
    const ctx = canvas.getContext('2d');

    let added = 0;
    let points = [];

    function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
    function round(x, d = 2) { return Number(x.toFixed(d)); }

    function ensureValidPair() {
      const a = analyteType.value;
      const t = titrantType.value;
      const acid = (x) => x === 'SA' || x === 'WA';
      const base = (x) => x === 'SB' || x === 'WB';

      if ((acid(a) && acid(t)) || (base(a) && base(t))) {
        if (acid(a)) titrantType.value = 'SB';
        else titrantType.value = 'SA';
        return false;
      }
      return true;
    }

    function pHStrongAcidStrongBase(nAcid, nBase, totalV) {
      const diff = nAcid - nBase;
      if (Math.abs(diff) < 1e-12) return 7;
      if (diff > 0) return -Math.log10(diff / totalV);
      const oh = -diff / totalV;
      return 14 + Math.log10(oh);
    }

    function pHWeakAcidStrongBase(nHA0, nOH, totalV, pKa) {
      const Ka = 10 ** (-pKa);
      const nHA = nHA0 - nOH;
      if (nOH <= 0) {
        const C = nHA0 / totalV;
        const H = Math.sqrt(Ka * C);
        return -Math.log10(H);
      }
      if (nHA > 1e-12) {
        const nA = nOH;
        return pKa + Math.log10(nA / nHA);
      }
      if (Math.abs(nHA) <= 1e-12) {
        const Csalt = nHA0 / totalV;
        const Kb = 1e-14 / Ka;
        const OH = Math.sqrt(Kb * Csalt);
        return 14 + Math.log10(OH);
      }
      const excessOH = (nOH - nHA0) / totalV;
      return 14 + Math.log10(excessOH);
    }

    function pHStrongAcidWeakBase(nB0, nH, totalV, pKb) {
      const pKaConj = 14 - pKb;
      const Ka = 10 ** (-pKaConj);
      const nB = nB0 - nH;
      if (nH <= 0) {
        const Kb = 10 ** (-pKb);
        const C = nB0 / totalV;
        const OH = Math.sqrt(Kb * C);
        return 14 + Math.log10(OH);
      }
      if (nB > 1e-12) {
        const nBH = nH;
        return pKaConj + Math.log10(nB / nBH);
      }
      if (Math.abs(nB) <= 1e-12) {
        const Csalt = nB0 / totalV;
        const H = Math.sqrt(Ka * Csalt);
        return -Math.log10(H);
      }
      const excessH = (nH - nB0) / totalV;
      return -Math.log10(excessH);
    }

    function solvePH(vAddMl) {
      ensureValidPair();
      const a = analyteType.value;
      const t = titrantType.value;
      const CA = Number(ca.value);
      const CB = Number(cb.value);
      const VA = Number(va.value) / 1000;
      const VB = vAddMl / 1000;
      const totalV = VA + VB;
      const pKa = Number(pKaInput.value);
      const pKb = pKa;

      let pH = 7;
      if (a === 'SA' && t === 'SB') {
        pH = pHStrongAcidStrongBase(CA * VA, CB * VB, totalV);
      } else if (a === 'WA' && t === 'SB') {
        pH = pHWeakAcidStrongBase(CA * VA, CB * VB, totalV, pKa);
      } else if (a === 'SB' && t === 'SA') {
        pH = 14 - pHStrongAcidStrongBase(CB * VB, CA * VA, totalV);
      } else if (a === 'WB' && t === 'SA') {
        pH = pHStrongAcidWeakBase(CA * VA, CB * VB, totalV, pKb);
      }
      return clamp(pH, 0, 14);
    }

    function equivalenceVolumeMl() {
      const CA = Number(ca.value);
      const CB = Number(cb.value);
      const VA = Number(va.value);
      return (CA * VA / CB);
    }

    function recalcCurve() {
      points = [];
      const ve = equivalenceVolumeMl();
      const maxV = Math.max(ve * 2, Number(va.value) * 1.5, 30);
      for (let v = 0; v <= maxV; v += maxV / 240) {
        points.push({ v, pH: solvePH(v) });
      }
      drawCurve(maxV);
      updateStatus();
    }

    function drawCurve(maxV) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const pad = { l: 48, r: 14, t: 14, b: 38 };
      const W = canvas.width - pad.l - pad.r;
      const H = canvas.height - pad.t - pad.b;

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 14; i += 2) {
        const y = pad.t + (14 - i) / 14 * H;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(canvas.width - pad.r, y); ctx.stroke();
      }
      for (let i = 0; i <= 10; i++) {
        const x = pad.l + i / 10 * W;
        ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, canvas.height - pad.b); ctx.stroke();
      }

      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2.3;
      ctx.beginPath();
      points.forEach((p, i) => {
        const x = pad.l + (p.v / maxV) * W;
        const y = pad.t + (14 - p.pH) / 14 * H;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      const currentPH = solvePH(added);
      const cx = pad.l + (added / maxV) * W;
      const cy = pad.t + (14 - currentPH) / 14 * H;
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '12px sans-serif';
      ctx.fillText('pH', 12, pad.t + 2);
      ctx.fillText('0', pad.l - 2, canvas.height - 16);
      ctx.fillText(maxV.toFixed(1) + ' mL', canvas.width - pad.r - 64, canvas.height - 16);

      for (let i = 0; i <= 14; i += 2) {
        const y = pad.t + (14 - i) / 14 * H + 4;
        ctx.fillText(String(i), 20, y);
      }
    }

    function updateStatus() {
      const a = analyteType.value;
      const t = titrantType.value;
      const ph = solvePH(added);
      const ve = equivalenceVolumeMl();
      const remain = Math.max(0, round(100 - added * 1.6, 1));
      buretteLiquid.style.height = clamp(remain, 4, 100) + '%';
      const hue = Math.round(220 - (ph / 14) * 210);
      beakerLiquid.style.background = `linear-gradient(180deg, hsl(${hue}, 85%, 68%) 0%, hsl(${hue}, 82%, 45%) 100%)`;

      const label = {
        SA: '強酸', WA: '弱酸', SB: '強鹼', WB: '弱鹼'
      };
      status.innerHTML = `待測：${label[a]}，滴定劑：${label[t]}<br>已加入：<b>${round(added)} mL</b><br>目前 pH：<b>${round(ph, 3)}</b>`;
      eqNote.textContent = `理論當量點約在 ${round(ve, 2)} mL（單質子模型近似）。`;
    }

    function addVol(v) {
      added = Math.max(0, added + v);
      recalcCurve();
    }

    document.getElementById('drop1').addEventListener('click', () => addVol(1));
    document.getElementById('drop5').addEventListener('click', () => addVol(5));
    document.getElementById('reset').addEventListener('click', () => { added = 0; recalcCurve(); });
    [analyteType, titrantType, ca, cb, va, pKaInput].forEach(el => {
      el.addEventListener('change', () => {
        const ok = ensureValidPair();
        if (!ok) alert('酸鹼配對需互補，已自動調整滴定劑類型。');
        recalcCurve();
      });
    });

    recalcCurve();
  </script>
</body>
</html>
